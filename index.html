<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Interactive Exploration</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sunlight.css">
    <link rel="stylesheet" href="css/twilight.css">
    <link rel="stylesheet" href="css/midnight.css">
    <link rel="stylesheet" href="css/abyssal.css">
</head>
<body>

    <header id="hero-section">
        <div id="dive-btn">LETS<br>DIVE</div>
    </header>

    <nav id="main-navigation">
        <div class="nav-container">
            <span>SUNLIGHT</span>
            <span>TWILIGHT</span>
            <span>MIDNIGHT</span>
            <span>ABYSSAL</span>
        </div>
    </nav>
    
    <section id="sunlight-zone">
        <h2>Sunlight Zone</h2>
    </section>
    
    <section id="twilight-zone">
        <h2>Twilight Zone</h2>
    </section>
    
    <section id="midnight-zone">
        <h2>Midnight Zone</h2>
    </section>
    
    <section id="abyssal-zone">
        <h2>Abyssal Zone</h2>
    </section>
    <div id="transition-overlay">
        <div class="reveal-wave"></div>
        <div class="reveal-bubbles">
            <span style="--i:11;"></span><span style="--i:15;"></span><span style="--i:24;"></span><span style="--i:10;"></span>
            <span style="--i:14;"></span><span style="--i:23;"></span><span style="--i:18;"></span><span style="--i:12;"></span>
            <span style="--i:20;"></span><span style="--i:14;"></span><span style="--i:12;"></span><span style="--i:17;"></span>
            <span style="--i:16;"></span><span style="--i:10;"></span><span style="--i:22;"></span><span style="--i:13;"></span>
            <span style="--i:25;"></span><span style="--i:19;"></span><span style="--i:11;"></span><span style="--i:15;"></span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <script src="js/sunlight.js"></script>
    <script src="js/twilight.js"></script>
    <script src="js/midnight.js"></script>
    <script src="js/abyssal.js"></script>
    
    <script src="js/main.js"></script>

</body>
</html>
